name: Validate RetroTelemetry

on:
  pull_request:
    paths:
      - 'games/**/*.json'
      - 'schemas/**'
      - 'tools/**'
      - 'tests/**'
      - 'manifest.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate definitions
        run: python tools/retrotelemetry.py validate
      - name: Verify manifest is current
        run: python tools/retrotelemetry.py check
      - name: Run tests
        run: python -m unittest discover -s tests -v
